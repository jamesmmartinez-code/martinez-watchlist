<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Realm of Eldoria</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="1" style="outline:none;">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		
        <style>
            #canvas{transition:box-shadow 0.2s;}
            body.unfocused #canvas{box-shadow:0 0 0 6px #ff4444 inset !important;}
            body.focused   #canvas{box-shadow:0 0 0 4px #44ff44 inset !important;}
            #focus-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
                background:rgba(255,80,80,0.97);color:#1a0e00;padding:24px 38px;
                border-radius:14px;font:bold 26px/1.3 system-ui,sans-serif;
                border:4px solid #1a0e00;cursor:pointer;z-index:9999;display:none;
                box-shadow:0 8px 28px rgba(0,0,0,0.7);text-align:center;
                animation:focus-pulse 1s ease-in-out infinite;}
            @keyframes focus-pulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.05);}}
            #focus-hint:hover{background:rgba(255,120,120,1);}
        </style>
        <div id="focus-hint">CLICK HERE TO PLAY<br><span style="font-size:16px;font-weight:normal;">(canvas needs keyboard focus for WASD)</span></div>
        <script>
        (function(){
            const c=document.getElementById('canvas');
            const hint=document.getElementById('focus-hint');
            let focused=false;
            function focusCanvas(){try{c.focus({preventScroll:true});}catch(e){}}
            function checkFocus(){
                const isFocused=(document.activeElement===c);
                if(isFocused!==focused){
                    focused=isFocused;
                    document.body.classList.toggle('focused',focused);
                    document.body.classList.toggle('unfocused',!focused);
                    hint.style.display=focused?'none':'block';
                    console.log('[Eldoria] focus state:',focused?'FOCUSED (WASD will work)':'NOT FOCUSED');
                }
            }
            // AGGRESSIVE: refocus every 100ms for first 5 seconds (covers Godot init reclaim)
            // 2026-05-07: gentler initial focus — was 100ms × 50 (5s of focus-stealing); now 250ms × 12 (3s)
            let aggressive_count=0;
            const aggressive=setInterval(()=>{
                if(document.activeElement!==c) focusCanvas();
                checkFocus();
                if(++aggressive_count>=12){clearInterval(aggressive);}
            },250);
            // After 5s, drop to gentle 1s polling
            setTimeout(()=>{setInterval(()=>{checkFocus();if(!focused)focusCanvas();},1000);},5000);
            // Click anywhere -> focus canvas
            // 2026-05-07: removed mousedown refocus — was fighting Godot's right-drag camera + click-handling.
            document.addEventListener('click',(e)=>{if(document.activeElement!==c){focusCanvas();checkFocus();}});
            hint.addEventListener('click',(e)=>{e.stopPropagation();focusCanvas();checkFocus();});
            window.addEventListener('focus',()=>{focusCanvas();checkFocus();});
            window.addEventListener('keydown',(e)=>{
                if(!focused){focusCanvas();checkFocus();}
                console.log('[Eldoria] keydown:',e.code,'focused:',document.activeElement===c);
            },true);
            console.log('[Eldoria] AGGRESSIVE focus manager v2 active');
        })();
        </script>

        <script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":182639048,"index.wasm":1509558},"focusCanvas":true,"gdextensionLibs":["libterrain.web.release.wasm32.wasm"],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		(async function loadChunkedPck() {
			const manifest = await (await fetch('pck-parts.json')).json();
			// Download all chunks first, measure actual sizes before allocating.
			// Prevents "offset out of bounds" if a chunk size differs from manifest
			// (e.g. during the mid-deploy race between new chunks and old manifest).
			const buffers = [];
			let actualTotal = 0;
			let fetched = 0;
			const manifestTotal = manifest.totalSize || 1;
			for (const part of manifest.parts) {
				const r = await fetch(part.name);
				if (!r.ok) throw new Error('Failed to fetch ' + part.name + ': ' + r.status);
				const buf = new Uint8Array(await r.arrayBuffer());
				buffers.push(buf);
				actualTotal += buf.byteLength;
				fetched += buf.byteLength;
				statusProgress.value = fetched;
				statusProgress.max = manifestTotal;
			}
			// Allocate using ACTUAL downloaded byte count, not manifest's totalSize.
			const merged = new Uint8Array(actualTotal);
			let offset = 0;
			for (const buf of buffers) {
				merged.set(buf, offset);
				offset += buf.byteLength;
			}
			// Monkey-patch preloadFile so Engine.startGame uses our reassembled
			// buffer instead of fetching a (non-existent) index.pck from the server.
			const origPreload = engine.preloadFile.bind(engine);
			engine.preloadFile = function (file, path) {
				if (file === 'index.pck') {
					return origPreload(merged.buffer, 'index.pck');
				}
				return origPreload(file, path);
			};
			await engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
			setStatusMode('hidden');
		})().catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
