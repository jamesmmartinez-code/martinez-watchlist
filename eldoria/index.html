<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Realm of Eldoria</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="1" style="outline:none;">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		
        <style>
            #focus-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
                background:rgba(255,195,60,0.95);color:#1a0e00;padding:18px 32px;
                border-radius:12px;font:bold 22px/1.3 system-ui,sans-serif;
                border:3px solid #1a0e00;cursor:pointer;z-index:9999;display:none;
                box-shadow:0 6px 20px rgba(0,0,0,0.6);text-align:center;}
            #focus-hint:hover{background:rgba(255,215,100,1);}
        </style>
        <div id="focus-hint">CLICK HERE TO PLAY<br><span style="font-size:14px;font-weight:normal;">(WASD won't work until you click on the game)</span></div>
        <script>
        (function(){
            const c=document.getElementById('canvas');
            const hint=document.getElementById('focus-hint');
            function focusCanvas(){try{c.focus();}catch(e){}}
            function checkFocus(){if(document.activeElement!==c){hint.style.display='block';}else{hint.style.display='none';}}
            window.addEventListener('load',()=>{setTimeout(focusCanvas,300);setTimeout(checkFocus,800);});
            document.addEventListener('mousedown',()=>{setTimeout(focusCanvas,0);setTimeout(checkFocus,50);});
            document.addEventListener('click',()=>{setTimeout(focusCanvas,0);setTimeout(checkFocus,50);});
            hint.addEventListener('click',()=>{focusCanvas();checkFocus();});
            setInterval(checkFocus,2000);
            window.addEventListener('focus',()=>{focusCanvas();checkFocus();});
            console.log('[Eldoria] focus manager active — canvas tabindex=1');
        })();
        </script>

        <script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":152123076,"index.wasm":1509558},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		(async function loadChunkedPck() {
			const manifest = await (await fetch('pck-parts.json')).json();
			const total = manifest.totalSize;
			const merged = new Uint8Array(total);
			let offset = 0;
			for (const part of manifest.parts) {
				const r = await fetch(part.name);
				if (!r.ok) throw new Error('Failed to fetch ' + part.name + ': ' + r.status);
				const buf = new Uint8Array(await r.arrayBuffer());
				merged.set(buf, offset);
				offset += buf.byteLength;
				statusProgress.value = offset;
				statusProgress.max = total;
			}
			// Monkey-patch preloadFile so Engine.startGame uses our reassembled
			// buffer instead of fetching a (non-existent) index.pck from the server.
			const origPreload = engine.preloadFile.bind(engine);
			engine.preloadFile = function (file, path) {
				if (file === 'index.pck') {
					return origPreload(merged.buffer, 'index.pck');
				}
				return origPreload(file, path);
			};
			await engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
			setStatusMode('hidden');
		})().catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
