name: Build Watchdog

# Runs every 15 minutes.  If the current main HEAD has a Godot build
# that is cancelled or failed (and nothing is in progress), it
# retriggers Build Eldoria so the live game always stays current.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write   # needed to trigger / cancel runs
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check build status and retrigger if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          WORKFLOW="build-eldoria.yml"

          # ── Current HEAD SHA ──────────────────────────────────────────────
          HEAD_SHA=$(gh api repos/$REPO/commits/main --jq '.sha')
          echo "HEAD: ${HEAD_SHA:0:8}"

          # ── Check for in-progress build ───────────────────────────────────
          IN_PROGRESS=$(gh api \
            "repos/$REPO/actions/workflows/$WORKFLOW/runs?status=in_progress&per_page=1" \
            --jq '.total_count')

          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "✅ Build already in progress — nothing to do."
            exit 0
          fi

          # ── Get the most recent run for current HEAD ─────────────────────
          LAST=$(gh api \
            "repos/$REPO/actions/workflows/$WORKFLOW/runs?head_sha=$HEAD_SHA&per_page=1" \
            --jq '.workflow_runs[0] | {conclusion, status, id}' 2>/dev/null || echo '{}')

          CONCLUSION=$(echo "$LAST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('conclusion') or d.get('status') or 'none')")
          RUN_ID=$(echo "$LAST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")

          echo "Last build for HEAD: $CONCLUSION (run $RUN_ID)"

          case "$CONCLUSION" in
            success)
              echo "✅ Current HEAD has a successful build — nothing to do."
              ;;
            in_progress|queued|waiting)
              echo "🔄 Build is running — nothing to do."
              ;;
            cancelled|failure|timed_out|stale|none)
              echo "⚠️  Build is $CONCLUSION — retriggering Build Eldoria..."
              gh workflow run "$WORKFLOW" --repo "$REPO" --ref main
              echo "✅ Build Eldoria retriggered."
              ;;
            *)
              echo "ℹ️  Unknown conclusion '$CONCLUSION' — retriggering to be safe..."
              gh workflow run "$WORKFLOW" --repo "$REPO" --ref main
              ;;
          esac
