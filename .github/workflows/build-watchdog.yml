name: Build Watchdog

# Runs every 15 minutes.
# Checks TWO things (build-eldoria.yml is disabled; CF Worker cron handles builds now):
#
# 1. LIVE URL HEALTH — fetches the Worker URL; checks it is serving the real game.
# 2. REPO PUSH HEALTH — checks that main has received a commit in the last
#    4 hours. If completely stale (agents stopped pushing), logs a warning commit.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check live URL + repo push health
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          GAME_URL="https://eldoria-api.james-m-martinez.workers.dev/eldoria/"

          # ── 1. LIVE URL HEALTH ───────────────────────────────────────────
          echo "Checking live URL..."
          HTTP_CODE=$(curl -sS -o /tmp/game_response.txt -w "%{http_code}" \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "User-Agent: eldoria-watchdog/1.0" \
            "$GAME_URL" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: live URL returned HTTP $HTTP_CODE"
          else
            BODY_SIZE=$(wc -c < /tmp/game_response.txt)
            if [ "$BODY_SIZE" -lt 2000 ]; then
              echo "WARNING: live URL response too small (${BODY_SIZE} bytes)"
            elif grep -q 'location.replace\|http-equiv="refresh"\|Cloudflare server' /tmp/game_response.txt 2>/dev/null; then
              echo "WARNING: live URL is serving redirect page instead of game"
            elif ! grep -q 'canvas\|index\.js' /tmp/game_response.txt 2>/dev/null; then
              echo "WARNING: live URL missing Godot game markers (canvas/index.js)"
            else
              echo "OK: Live URL serving real game shell (${BODY_SIZE} bytes)."
            fi
          fi

          # ── 2. REPO PUSH HEALTH ─────────────────────────────────────────
          LAST_COMMIT_TIME=$(gh api repos/$REPO/commits/main --jq '.commit.committer.date')
          LAST_TS=$(date -d "$LAST_COMMIT_TIME" +%s 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          AGE_HOURS=$(( (NOW_TS - LAST_TS) / 3600 ))
          echo "Last commit: $LAST_COMMIT_TIME (${AGE_HOURS}h ago)"

          if [ "$AGE_HOURS" -gt 4 ]; then
            echo "WARNING: Repo has been quiet for ${AGE_HOURS}h — agents may have stopped."
            git config user.name "build-watchdog[bot]"
            git config user.email "watchdog@eldoria"
            echo "$(date -u +%Y-%m-%dT%H:%MZ) watchdog: repo quiet ${AGE_HOURS}h" >> .github/watchdog.log
            git add .github/watchdog.log
            git commit -m "watchdog: repo quiet ${AGE_HOURS}h — last commit was $LAST_COMMIT_TIME [autofix]" || true
            git push || true
          else
            echo "OK: Repo push health: active (${AGE_HOURS}h since last commit)."
          fi
