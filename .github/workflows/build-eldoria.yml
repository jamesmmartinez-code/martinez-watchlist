name: Build Eldoria (Godot Web Export)

# Triggered on every push to main that touches the Godot source folder.
# Installs Godot 4.6.2 headless, runs --import to bake assets, then
# --export-release "Web" to produce the WASM build at /eldoria/, and commits
# the built files back to the same branch so GitHub Pages serves them.

on:
  push:
    branches: [main]
    paths:
      - 'eldoria-godot/**'
      - '.github/workflows/build-eldoria.yml'
  workflow_dispatch:   # also allow manual trigger from the Actions tab

# Only ONE build runs at a time; newer pushes cancel older in-progress runs.
# This stops the "remote rejected, fetch first" race that was killing builds.
concurrency:
  group: build-eldoria
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit the built /eldoria/ folder back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot
          key: godot-4.6.2-templates-v1

      - name: Install Godot 4.6.2 headless + Web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.6.2.stable/
          rm -rf /tmp/templates templates.tpz godot.zip

      - name: Hash asset folder (cache key for .godot/)
        id: asset-hash
        run: |
          # Hash all source assets so cache invalidates only when assets actually change.
          HASH=$(find eldoria-godot/assets eldoria-godot/scenes eldoria-godot/scripts -type f \
            \( -name "*.glb" -o -name "*.gltf" -o -name "*.png" -o -name "*.jpg" \
               -o -name "*.tres" -o -name "*.tscn" -o -name "*.gd" -o -name "*.import" \) \
            -exec sha256sum {} \; 2>/dev/null | sort | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Asset hash: $HASH"

      - name: Cache .godot/ import folder (skip reimport when assets unchanged)
        id: cache-godot-import
        uses: actions/cache@v4
        with:
          path: eldoria-godot/.godot
          key: godot-import-${{ steps.asset-hash.outputs.hash }}
          restore-keys: |
            godot-import-

      - name: Import all assets (generates .import files)
        run: |
          cd eldoria-godot
          if [ -d .godot ] && [ "${{ steps.cache-godot-import.outputs.cache-hit }}" = "true" ]; then
            echo "✅ .godot/ cache hit — skipping full reimport"
            ~/godot/godot --headless --path . --import 2>&1 | tail -10 || true
          else
            echo "⚠️  cache miss — full asset import"
            ~/godot/godot --headless --path . --import 2>&1 | tail -50 || true
          fi

      - name: Export Web build
        run: |
          cd eldoria-godot
          mkdir -p web-export
          ~/godot/godot --headless --path . --export-release "Web" web-export/index.html 2>&1 | tail -50

      - name: Verify export produced index.html
        run: |
          if [ ! -f eldoria-godot/web-export/index.html ]; then
            echo "❌ Web export failed — index.html not produced"
            exit 1
          fi
          ls -la eldoria-godot/web-export/

      - name: Copy built files to /eldoria/ (GitHub Pages serves from repo root)
        run: |
          rm -rf eldoria
          mkdir -p eldoria
          cp -R eldoria-godot/web-export/* eldoria/

      - name: Inject canvas focus-manager into index.html (PX 2026-05-05)
        run: |
          python3 .github/scripts/inject-focus-manager.py eldoria/index.html

      - name: Split index.pck into <100MB chunks (GitHub blob limit)
        run: |
          python3 .github/scripts/split-pck.py eldoria

      - name: Commit + push the built /eldoria/ folder (with rebase retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eldoria/
          if git diff --cached --quiet; then
            echo "✅ No build output changes to commit."
            exit 0
          fi
          git commit -m "Auto-build Eldoria Web export ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Retry up to 5 times with rebase to handle concurrent agent pushes.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ pushed on attempt $i"
              exit 0
            fi
            echo "⚠️  push rejected (attempt $i) — pulling with rebase"
            git pull --rebase --autostash origin main || true
            sleep $((i * 2))
          done
          echo "❌ push failed after 5 retries"
          exit 1

      - name: Push /eldoria/ to Cloudflare R2 (sync the live game URL)
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "⚠️  CF_TOKEN or CF_ACCOUNT_ID secret not set — skipping R2 sync"
            exit 0
          fi
          BUCKET="eldoria-game"
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          mime_for() {
            case "$1" in
              *.html) echo "text/html; charset=utf-8" ;;
              *.js)   echo "application/javascript" ;;
              *.wasm) echo "application/wasm" ;;
              *.png)  echo "image/png" ;;
              *.json) echo "application/json" ;;
              *)      echo "application/octet-stream" ;;
            esac
          }
          OK=0; FAIL=0
          for f in eldoria/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            mime=$(mime_for "$f")
            CODE=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" \
              -X PUT -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: $mime" --data-binary "@$f" \
              "$API/$name")
            if [ "$CODE" = "200" ]; then OK=$((OK+1)); echo "  ✅ $name"; else FAIL=$((FAIL+1)); echo "  ❌ $name → HTTP $CODE"; fi
          done
          echo "🚢 R2 sync: $OK ok, $FAIL failed"
