name: Build Eldoria (Godot Web Export)

# Triggered on every push to main that touches the Godot source folder.
# Installs Godot 4.6.2 headless, runs --import to bake assets, then
# --export-release "Web" to produce the WASM build at /eldoria/, and commits
# the built files back to the same branch so GitHub Pages serves them.

on:
  push:
    branches: [main]
    paths:
      - 'eldoria-godot/**'
      - '.github/workflows/build-eldoria.yml'
      - '!eldoria-godot/**/*.md'   # doc-only changes don't need a game rebuild
  workflow_dispatch:   # also allow manual trigger from the Actions tab

# Only ONE build runs at a time; newer pushes cancel older in-progress runs.
# This stops the "remote rejected, fetch first" race that was killing builds.
concurrency:
  group: build-eldoria
  cancel-in-progress: true

permissions:
  contents: write   # needed to commit the built /eldoria/ folder back
  pages: write      # 2026-05-06: deploy-pages action needs this
  id-token: write   # 2026-05-06: deploy-pages OIDC token (fixes transient deploy failures)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Visual bounds check (Main.tscn — gates fog/scale)
        run: |
          python3 .github/scripts/check_main_tscn.py
        # Hard-fail the build if Hero scale or fog density are out of band.
        # Prevents giant-boot bug + brown-fog-soup bug from ever shipping.
        # Constraints live in eldoria-godot/qa/_visual_constraints.yaml.

      - name: Blank-world audit (orphan global_position guard)
        # Scans WorldBuilder.gd for Node3D.new() then .global_position before add_child.
        # That pattern silently aborts the async build coroutine => blank world (grass only).
        run: python3 .github/scripts/bw_audit.py

      - name: Cache Godot binary + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot
          key: godot-4.6.2-templates-v1

      - name: Install Godot 4.6.2 headless + Web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.6.2.stable/
          rm -rf /tmp/templates templates.tpz godot.zip

      - name: Hash asset folder (cache key for .godot/)
        id: asset-hash
        run: |
          # Hash all source assets + data files so cache invalidates on any change.
          HASH=$(find eldoria-godot/assets eldoria-godot/scenes eldoria-godot/scripts eldoria-godot/data -type f \
            \( -name "*.glb" -o -name "*.gltf" -o -name "*.png" -o -name "*.jpg" \
               -o -name "*.tres" -o -name "*.tscn" -o -name "*.gd" -o -name "*.import" \) \
            -exec sha256sum {} \; 2>/dev/null | sort | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Asset hash: $HASH"

      - name: Cache .godot/ import folder (skip reimport when assets unchanged)
        id: cache-godot-import
        uses: actions/cache@v4
        with:
          path: eldoria-godot/.godot
          key: godot-import-${{ steps.asset-hash.outputs.hash }}
          # No restore-keys: a hash miss must do a full reimport, not reuse stale .gdc bytecode

      - name: Import all assets (generates .import files)
        run: |
          cd eldoria-godot
          if [ -d .godot ] && [ "${{ steps.cache-godot-import.outputs.cache-hit }}" = "true" ]; then
            echo "✅ .godot/ cache hit — skipping full reimport"
            ~/godot/godot --headless --path . --import 2>&1 | tail -10 || true
          else
            echo "⚠️  cache miss — full asset import"
            ~/godot/godot --headless --path . --import 2>&1 | tail -50 || true
          fi


      - name: Build humanoid_base.tres AnimationLibrary from merged GLB
        run: |
          cd eldoria-godot
          if [ -f assets/animations/humanoid_base.glb ]; then
            echo "Building humanoid_base.tres from pre-merged GLB..."
            ~/godot/godot --headless --path . \
              --script res://scripts/dev/build_from_merged_glb.gd 2>&1 | tail -30
            if [ -f assets/animations/humanoid_base.tres ]; then
              echo "✅ humanoid_base.tres generated"
            else
              echo "⚠️  humanoid_base.tres not generated (non-fatal — continuing build)"
            fi
          else
            echo "⚠️  humanoid_base.glb missing — skipping AnimLib build"
          fi

      - name: Disable editor-only plugins for headless export
        run: |
          # terrain_3d editor plugin uses Terrain3DEditor (editor-only class) which
          # fails in headless --export mode. Strip it from enabled plugins before export.
          sed -i '/^\[editor_plugins\]/,/^$/d' eldoria-godot/project.godot
          echo "✅ editor_plugins section removed from project.godot"

      - name: GDScript lint (catch ternary + Array[Node3D] regressions)
        run: python3 .github/scripts/gdscript_lint.py

      - name: Export Web build
        run: |
          cd eldoria-godot
          mkdir -p web-export
          # Capture ALL Godot output (including SCRIPT ERROR) to log + console
          ~/godot/godot --headless --path . --export-release "Web" web-export/index.html 2>&1 | tee /tmp/godot_export.log || true
          # Fail the build if Godot printed any SCRIPT ERROR lines
          if grep -q "SCRIPT ERROR" /tmp/godot_export.log; then
            echo "❌ Godot export produced SCRIPT ERROR(s):"
            grep "SCRIPT ERROR" /tmp/godot_export.log
            exit 1
          fi
          echo "✅ Export complete — no SCRIPT ERRORs"

      - name: Verify export produced index.html
        run: |
          if [ ! -f eldoria-godot/web-export/index.html ]; then
            echo "❌ Web export failed — index.html not produced"
            exit 1
          fi
          ls -la eldoria-godot/web-export/

      - name: Copy built files to /eldoria/ (GitHub Pages serves from repo root)
        run: |
          rm -rf eldoria
          mkdir -p eldoria
          cp -R eldoria-godot/web-export/* eldoria/

      - name: Inject canvas focus-manager into index.html (PX 2026-05-05)
        run: |
          python3 .github/scripts/inject-focus-manager.py eldoria/index.html

      - name: Split index.pck into <100MB chunks (GitHub blob limit)
        run: |
          python3 .github/scripts/split-pck.py eldoria

      - name: Commit + push the built /eldoria/ folder (with rebase retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A eldoria/
          if git diff --cached --quiet; then
            echo "✅ No build output changes to commit."
            exit 0
          fi
          git commit -m "Auto-build Eldoria Web export ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Back up our freshly-built /eldoria/ so we can restore it after
          # any rebase conflict — two concurrent builds can't be "merged".
          cp -r eldoria /tmp/eldoria_freshbuild
          # Retry up to 5 times with rebase to handle concurrent agent pushes.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ pushed on attempt $i"
              exit 0
            fi
            echo "⚠️  push rejected (attempt $i) — pulling with rebase"
            git pull --rebase --autostash -X ours origin main || true
            # Restore our freshly-built /eldoria/ (wins over any rebase conflict)
            cp -r /tmp/eldoria_freshbuild/* eldoria/
            git add -A eldoria/
            sleep $((i * 2))
          done
          echo "❌ push failed after 5 retries"
          exit 1

      - name: Push /eldoria/ to Cloudflare R2 (sync the live game URL)
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "⚠️  CF_TOKEN or CF_ACCOUNT_ID secret not set — skipping R2 sync"
            exit 0
          fi
          BUCKET="eldoria-game"
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/$BUCKET/objects"
          mime_for() {
            case "$1" in
              *.html) echo "text/html; charset=utf-8" ;;
              *.js)   echo "application/javascript" ;;
              *.wasm) echo "application/wasm" ;;
              *.png)  echo "image/png" ;;
              *.json) echo "application/json" ;;
              *)      echo "application/octet-stream" ;;
            esac
          }
          OK=0; FAIL=0
          # Upload all files. index.html is the real Godot game shell at this point
          # (redirect is written AFTER this step). pck-parts.json is uploaded last
          # (atomic manifest swap — clients never see new manifest with old chunks).
          for f in eldoria/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # index.html IS uploaded to R2 here — at this point in the workflow
            # it is still the Godot game shell (patched by inject-focus-manager + split-pck).
            # The GitHub Pages redirect is written in the NEXT step ("Overwrite GH Pages"),
            # which runs AFTER this R2 sync, so no loop risk here.
            # DEFER pck-parts.json — uploaded last after all chunks are live.
            # index.html at this point is the REAL Godot game shell.
            # Upload it as both index.html AND game.html in R2.
            # (The redirect overwrites index.html on disk AFTER this step, not before.)
            # Worker reads game.html so it always gets the game, never the redirect.
            if [ "$name" = "pck-parts.json" ]; then
              echo "  ⏳  pck-parts.json (deferred — uploading last)"
              continue
            fi
            mime=$(mime_for "$f")
            CODE=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" \
              -X PUT -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: $mime" --data-binary "@$f" \
              "$API/$name")
            if [ "$CODE" = "200" ]; then OK=$((OK+1)); echo "  ✅ $name"; else FAIL=$((FAIL+1)); echo "  ❌ $name → HTTP $CODE"; fi
            # Also upload index.html as game.html — the Worker fetches game.html
            # so redirect commits never clobber the live game shell in R2.
            if [ "$name" = "index.html" ]; then
              CODE2=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" \
                -X PUT -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: $mime" --data-binary "@$f" \
                "$API/game.html")
              if [ "$CODE2" = "200" ]; then OK=$((OK+1)); echo "  ✅ game.html (mirror)"; else FAIL=$((FAIL+1)); echo "  ❌ game.html → HTTP $CODE2"; fi
            fi
          done
          # Upload manifest LAST — atomic swap so clients always see a consistent state.
          if [ -f "eldoria/pck-parts.json" ]; then
            mime=$(mime_for "eldoria/pck-parts.json")
            CODE=$(curl -sS --max-time 90 -o /dev/null -w "%{http_code}" \
              -X PUT -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: $mime" --data-binary "@eldoria/pck-parts.json" \
              "$API/pck-parts.json")
            if [ "$CODE" = "200" ]; then OK=$((OK+1)); echo "  ✅ pck-parts.json (manifest — uploaded last)"; else FAIL=$((FAIL+1)); echo "  ❌ pck-parts.json → HTTP $CODE"; fi
          fi
          echo "🚢 R2 sync: $OK ok, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "❌ R2 sync had $FAIL failure(s) — aborting"
            exit 1
          fi
          # Verify game.html in R2 is the real game shell, not a redirect
          python3 .github/scripts/r2_verify.py


      - name: Inject BGM into game.html in R2
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BGM_B64: ""
        run: |
          python3 << 'INJECT_EOF'
          import os, urllib.request, base64, json, sys
          cf_token = os.environ.get("CF_TOKEN", "")
          cf_account = os.environ.get("CF_ACCOUNT_ID", "")
          bgm_b64 = os.environ.get("BGM_B64", "")
          if not cf_token or not cf_account:
              print("Skipping BGM - no CF creds"); sys.exit(0)
          api = "https://api.cloudflare.com/client/v4/accounts/" + cf_account + "/r2/buckets/eldoria-game/objects"
          req = urllib.request.Request(api + "/game.html", headers={"Authorization": "Bearer " + cf_token})
          with urllib.request.urlopen(req, timeout=15) as r:
              html = r.read().decode("utf-8", "replace")
          print("game.html: " + str(len(html)) + " bytes")
          if "eldoria-bgm" in html:
              print("BGM already present"); sys.exit(0)
          if "location.replace" in html or len(html) < 5000:
              print("game.html corrupt - skip"); sys.exit(0)
          bgm = base64.b64decode(bgm_b64).decode("utf-8")
          patched = html.replace("</body>", bgm + "</body>", 1) if "</body>" in html else html + bgm
          print("Patched: " + str(len(html)) + " -> " + str(len(patched)) + " bytes")
          data = patched.encode("utf-8")
          put = urllib.request.Request(api + "/game.html", data=data, method="PUT",
              headers={"Authorization": "Bearer " + cf_token, "Content-Type": "text/html; charset=utf-8"})
          with urllib.request.urlopen(put, timeout=30) as r:
              result = json.loads(r.read())
          print("BGM injected OK" if result.get("success") else "Upload failed: " + str(result))
          INJECT_EOF
      - name: Overwrite GH Pages /eldoria/index.html with redirect → Cloudflare
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat > eldoria/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Realm of Eldoria — loading…</title>
          <meta http-equiv="refresh" content="0; url=https://eldoria-api.james-m-martinez.workers.dev/eldoria/">
          <link rel="canonical" href="https://eldoria-api.james-m-martinez.workers.dev/eldoria/">
          <style>
          html,body{margin:0;height:100%;background:#0d0d12;color:#e8d4a2;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
          a{color:#ffd24d;text-decoration:underline}
          .box{padding:2rem;max-width:480px}
          h1{margin:0 0 .8rem;font-size:1.6rem}
          p{margin:.4rem 0;line-height:1.4}
          </style>
          </head>
          <body>
          <div class="box">
          <h1>Realm of Eldoria</h1>
          <p>Taking you to the fast Cloudflare server…</p>
          <p>If nothing happens, <a href="https://eldoria-api.james-m-martinez.workers.dev/eldoria/">click here to play</a>.</p>
          </div>
          <script>location.replace("https://eldoria-api.james-m-martinez.workers.dev/eldoria/");</script>
          </body>
          </html>
          HTML
          git add eldoria/index.html
          if git diff --cached --quiet; then
            echo "✅ redirect index.html unchanged."
            exit 0
          fi
          git commit -m "Auto: re-apply /eldoria/ redirect → Cloudflare ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            if git push; then echo "✅ pushed redirect on attempt $i"; exit 0; fi
            git pull --rebase --autostash -X ours origin main || true
            sleep $((i * 2))
          done
          echo "❌ redirect push failed"; exit 1

      - name: Post-deploy smoke test (verify live URL serves real game)
        if: success()
        run: |
          sleep 10
          python3 .github/scripts/smoke_test.py

